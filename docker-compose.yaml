services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.126.0
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - 1888:1888 # pprof extension
      - 8888:8888 # Prometheus metrics exposed by the Collector
      - 8889:8889 # Prometheus exporter metrics
      - 13133:13133 # health_check extension
      - 4317:4317 # OTLP gRPC receiver
      - 4318:4318 # OTLP http receiver
      - 55679:55679 # zpages extension
  # Infrastructure
  loki:
    image: grafana/loki:3.0.0
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ../volumes/loki-data:/var/loki

  minio:
    image: minio/minio
    entrypoint:
      - sh
      - -euc
      - |
        mkdir -p /data/loki-data && \
        mkdir -p /data/loki-ruler && \
        minio server /data --console-address :9001
    environment:
      - MINIO_ROOT_USER=loki
      - MINIO_ROOT_PASSWORD=supersecret
      - MINIO_PROMETHEUS_AUTH_TYPE=public
      - MINIO_UPDATE=off
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - ../volumes/minio-data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 15s
      timeout: 20s
      retries: 5


  prometheus:
    image: prom/prometheus:v2.51.2
    ports:
      - "9090:9090"
    volumes:
      - ./etc/prometheus:/workspace
    command:
      - --config.file=/workspace/prometheus.yml
      - --enable-feature=exemplar-storage
    depends_on:
      - loki
    #logging: *default-logging

  tempo:
    image: grafana/tempo:2.7.2
    command: [ "--target=all","-config.file=/etc/tempo.yaml", "--storage.trace.backend=local", "--storage.trace.local.path=/var/tempo", "--auth.enabled=false" ]
    ports:
      - "3200:3200"
      - "14250:14250"
      - "4417:4317"
    volumes:
      - ./etc/tempo/tempo.yaml:/etc/tempo.yaml
      - ../volumes/tempo-data:/var/tempo
    depends_on:
      - loki
    #logging: *default-logging

  grafana:
    image: grafana/grafana:10.4.2
    ports:
      - "3000:3000"
    volumes:
      - ./etc/grafana/:/etc/grafana/provisioning/datasources
      - ./etc/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml
      - ./etc/dashboards:/etc/grafana/dashboards
    depends_on:
      - loki
      - prometheus
    #logging: *default-logging

  # Applications

  app-a:
    build: ./app/
    #image: ghcr.io/blueswen/spring-boot-observability/app:latest
    environment:
      - TARGET_ONE_HOST=app-b
      - TARGET_TWO_HOST=app-c
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317 # send traces to otel collector
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc # use gRPC for OTLP
      - OTEL_SERVICE_NAME=app-a # service name for Span
      - OTEL_RESOURCE_ATTRIBUTES=compose_service=app-a # add custom resource attribute to Span for Grafana Trace to Logs feature
      #      - OTEL_METRICS_EXPORTER=none # disable metrics exporter
      #      - OTEL_LOGS_EXPORTER=none # disable logs exporter
      - MANAGEMENT_METRICS_TAGS_APPLICATION=app-a # override default value of management.metrics.tags.application in app/src/main/resources/application.properties
    ports:
      - "8080:8080"
    #logging: *default-logging

  app-b:
    build: ./app/
    #image: ghcr.io/blueswen/spring-boot-observability/app:latest
    environment:
      - TARGET_ONE_HOST=app-b
      - TARGET_TWO_HOST=app-c
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_SERVICE_NAME=app-b
      - OTEL_RESOURCE_ATTRIBUTES=compose_service=app-b
#      - OTEL_METRICS_EXPORTER=none
#      - OTEL_LOGS_EXPORTER=none
      - MANAGEMENT_METRICS_TAGS_APPLICATION=app-b
    ports:
      - "8081:8080"
    #logging: *default-logging

  app-c:
    build: ./app/
    #image: ghcr.io/blueswen/spring-boot-observability/app:latest
    environment:
      - TARGET_ONE_HOST=app-b
      - TARGET_TWO_HOST=app-c
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_SERVICE_NAME=app-c
      - OTEL_RESOURCE_ATTRIBUTES=compose_service=app-c
      #      - OTEL_METRICS_EXPORTER=none
      #      - OTEL_LOGS_EXPORTER=none
      - MANAGEMENT_METRICS_TAGS_APPLICATION=app-c
    ports:
      - "8082:8080"
    #logging: *default-logging

  postgres:
    image: postgres:17.4-alpine3.21
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - "5432:5432"
    #logging: *default-logging

  redis:
    image: redis:7.2.4
    ports:
      - "6379:6379"
    #logging: *default-logging
